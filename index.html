<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>PRINCE MINI | Loading System</title>

<style>
:root {
  --cyan: #16f4ff;
  --blue: #075bff;
  --dark-blue: #06152c;
  --muted: #147e99;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: #000;
  color: white;
  font-family: "Courier New", monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.hud {
  width: 100%;
  position: relative;
  aspect-ratio: 16 / 9;
  max-height: 75vh;
  background:
    radial-gradient(ellipse at center, #062332 0%, #030a15 52%, #02060d 100%);
  border-top: 1px solid #00eaff10;
  border-bottom: 1px solid #00eaff10;
  overflow: hidden;
}

.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(#12344b45 1px, transparent 1px),
    linear-gradient(90deg, #12344b45 1px, transparent 1px);
  background-size: 43px 43px;
  opacity: .65;
}

.hud svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.corner {
  fill: none;
  stroke: var(--cyan);
  stroke-width: 2.2;
}

.top-line {
  fill: none;
  stroke: var(--cyan);
  stroke-width: 1.5;
}

.circuit {
  fill: none;
  stroke: #075bff;
  stroke-width: .7;
  opacity: .5;
}

.center {
  position: absolute;
  width: 34%;
  aspect-ratio: 1;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
}

.circle {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid #075bff80;
  box-shadow: 0 0 15px #00eaff0a;
}

.circle.outer {
  inset: -7%;
  border: 3px dashed #19eaff99;
  animation: rotate 14s linear infinite;
}

.circle.middle {
  inset: -2%;
  border: 5px solid transparent;
  border-top-color: var(--cyan);
  border-bottom-color: var(--cyan);
  filter: drop-shadow(0 0 5px #00eaff);
  animation: rotate 3s linear infinite;
}

.circle.inner {
  inset: 10%;
  border: 1px solid #075bff;
  animation: rotate 9s linear infinite reverse;
}

.core {
  width: 68%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, #082d3c, #03111d);
  box-shadow: inset 0 0 30px #00eaff0b;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

.brand {
  color: var(--cyan);
  font-size: clamp(9px, 2vw, 18px);
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow: 0 0 8px #00eaff90;
}

.loading {
  margin-top: 8px;
  font-size: clamp(6px, 1.1vw, 10px);
  letter-spacing: 2px;
  color: #c1fcff;
}

.mini-line {
  width: 35%;
  height: 2px;
  margin-top: 7px;
  background: linear-gradient(90deg, transparent, var(--blue), var(--cyan), transparent);
  animation: pulse 1s infinite alternate;
}

.dots {
  display: inline-block;
  width: 0;
  overflow: hidden;
  vertical-align: bottom;
  animation: dots 1s steps(4) infinite;
}

@keyframes dots {
  to { width: 18px; }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  to { opacity: .35; }
}

.side-bars {
  position: absolute;
  left: 7%;
  top: 32%;
  width: 7%;
  height: 36%;
  border-left: 1px solid #075bff99;
  border-right: 1px solid #075bff55;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 5px;
}

.side-bars span {
  display: block;
  height: 4px;
  background: var(--cyan);
  box-shadow: 0 0 4px #00eaff50;
}

.side-bars span:nth-child(2) { width: 85%; }
.side-bars span:nth-child(3) { width: 75%; }
.side-bars span:nth-child(4) { width: 60%; }
.side-bars span:nth-child(5) { width: 45%; background: var(--blue); }
.side-bars span:nth-child(6) { width: 30%; background: #075bff; }

.side-gauge {
  position: absolute;
  right: 7%;
  top: 39%;
  width: 10%;
  aspect-ratio: 1;
  border: 2px solid #075bff;
  border-right-color: var(--cyan);
  border-radius: 50%;
  animation: rotate 5s linear infinite;
}

.side-gauge::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  height: 50%;
  width: 1px;
  background: var(--cyan);
  transform: rotate(45deg);
  transform-origin: bottom;
}

.side-gauge::after {
  content: "";
  position: absolute;
  left: 45%;
  top: 45%;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--cyan);
}

.gauge-line {
  position: absolute;
  right: 7%;
  top: 58%;
  width: 10%;
  height: 3px;
  background: var(--blue);
  box-shadow: 0 6px 0 #075bff60;
}

.progress-wrap {
  position: absolute;
  width: 52%;
  height: 5%;
  left: 24%;
  bottom: 9%;
  padding: 3px;
  border: 1px solid #075bff;
  transform: skewX(-8deg);
  background: #030a14;
}

.progress {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #075bff, var(--cyan));
  box-shadow: 0 0 8px #00eaff70;
}

.percent {
  position: absolute;
  bottom: 15%;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(6px, 1vw, 10px);
  color: var(--cyan);
  letter-spacing: 2px;
}

.info {
  position: absolute;
  left: 50%;
  top: 5%;
  transform: translateX(-50%);
  color: #0e9bac;
  font-size: clamp(5px, .8vw, 8px);
  letter-spacing: 3px;
  white-space: nowrap;
}

.side-status {
  position: absolute;
  bottom: 5%;
  left: 4%;
  color: #11677e;
  font-size: clamp(5px, .7vw, 8px);
}

.server {
  position: absolute;
  bottom: 5%;
  right: 4%;
  color: #fbbf24;
  font-size: clamp(5px, .7vw, 8px);
  text-align: right;
}

.footer {
  position: fixed;
  bottom: 23px;
  width: 100%;
  text-align: center;
  color: #087f96;
  font-size: 10px;
  letter-spacing: 3px;
}

.footer strong {
  color: var(--cyan);
}

@media (min-width: 700px) {
  .hud {
    width: min(100%, 1100px);
    max-height: 70vh;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<main class="hud">
  <div class="grid"></div>

  <svg viewBox="0 0 1000 562" preserveAspectRatio="none"
       aria-hidden="true">
    <g class="circuit">
      <path d="M0 120 H140 L190 70 H280"/>
      <path d="M1000 120 H860 L810 70 H720"/>
      <path d="M0 440 H150 L200 490 H280"/>
      <path d="M1000 440 H850 L800 490 H720"/>
      <path d="M300 40 H700 L730 70"/>
      <path d="M300 522 H700 L730 492"/>
      <path d="M450 0 V35 M470 0 V22 M490 0 V15"/>
      <path d="M520 562 V530 M540 562 V540 M560 562 V530"/>
    </g>

    <g class="corner">
      <path d="M25 70 V25 H100"/>
      <path d="M975 70 V25 H900"/>
      <path d="M25 492 V537 H100"/>
      <path d="M975 492 V537 H900"/>
    </g>

    <g class="top-line">
      <path d="M310 25 L340 55 H660 L690 25"/>
      <path d="M25 90 H90 M910 90 H975"/>
      <path d="M25 472 H90 M910 472 H975"/>
    </g>

    <g fill="#075bff">
      <rect x="437" y="35" width="25" height="6"/>
      <rect x="467" y="35" width="25" height="6" fill="#00eaff"/>
      <rect x="497" y="35" width="25" height="6"/>
      <rect x="527" y="35" width="25" height="6"/>
    </g>
  </svg>

  <div class="info">PRINCE MINI // SYSTEM INITIALIZATION</div>

  <div class="side-bars" aria-hidden="true">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>

  <div class="side-gauge" aria-hidden="true"></div>
  <div class="gauge-line" aria-hidden="true"></div>

  <div class="center">
    <div class="circle outer"></div>
    <div class="circle middle"></div>
    <div class="circle inner"></div>

    <div class="core">
      <div class="brand">PRINCE MINI</div>
      <div class="loading">LOADING<span class="dots">....</span></div>
      <div class="mini-line"></div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress" id="progress"></div>
  </div>

  <div class="percent" id="percent">0%</div>

  <div class="side-status" id="visitors">
    VISITORS: CONFIGURE COUNTER
  </div>

  <div class="server" id="server">
    SERVER: CHECKING
  </div>
</main>

<footer class="footer">
  POWERED BY <strong>PRINCE MINI</strong>
</footer>

<script>
(() => {
  const PROJECT_URL =
    "https://nastry-mini-production.up.railway.app";

  const LOADING_TIME = 4000;

  // For a shared visitor count, configure a hosted counter service.
  // This endpoint must be configured for your own counter service.
  const COUNTER_URL = "";

  const progress = document.getElementById("progress");
  const percent = document.getElementById("percent");
  const server = document.getElementById("server");
  const visitors = document.getElementById("visitors");

  let destination;

  try {
    const url = new URL(PROJECT_URL);
    if (url.protocol === "https:") destination = url.href;
  } catch (_) {}

  if (!destination) {
    server.textContent = "SERVER: INVALID URL";
    return;
  }

  // Browser-side server check. CORS may prevent a definitive result.
  async function checkServer() {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 2200);

    try {
      const response = await fetch(destination, {
        method: "GET",
        mode: "cors",
        cache: "no-store",
        signal: controller.signal
      });

      clearTimeout(timer);

      server.textContent = response.ok
        ? "SERVER: RESPONDING"
        : "SERVER: HTTP " + response.status;
    } catch (_) {
      clearTimeout(timer);
      server.textContent = "SERVER: UNVERIFIED";
    }
  }

  // Shared visitor counter requires your provider's real endpoint.
  async function countVisitors() {
    if (!COUNTER_URL) {
      visitors.textContent = "VISITORS: SETUP REQUIRED";
      return;
    }

    try {
      const response = await fetch(COUNTER_URL, {
        cache: "no-store"
      });

      if (!response.ok) throw new Error("Counter unavailable");

      const data = await response.json();
      const count = Number(data.count);

      visitors.textContent = Number.isFinite(count)
        ? "VISITORS: " + count.toLocaleString()
        : "VISITORS: UNAVAILABLE";
    } catch (_) {
      visitors.textContent = "VISITORS: UNAVAILABLE";
    }
  }

  checkServer();
  countVisitors();

  const start = performance.now();

  function animate(now) {
    const ratio = Math.min(
      (now - start) / LOADING_TIME, 1
    );

    const value = Math.floor(ratio * 100);
    progress.style.width = value + "%";
    percent.textContent = value + "%";

    if (ratio < 1) {
      requestAnimationFrame(animate);
    } else {
      window.location.replace(destination);
    }
  }

  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
